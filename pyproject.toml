[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-archive"
version = "0.1.0"
description = "微信群聊消息过滤归档工具（纯本地）: 清洗→脱敏→SQLite+FTS5→检索/统计/周报"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
chat-archive = "chat_archive.cli:main"

[tool.setuptools.packages.find]
include = ["chat_archive*"]
